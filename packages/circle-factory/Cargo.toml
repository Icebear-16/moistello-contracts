[package]
name = "circle-factory"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
soroban-token-sdk = { workspace = true }
common = { path = "../common" }

[features]
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
circle = { path = "../circle" }
soroban-sdk = { workspace = true, features = ["testutils"] }

[lints]
workspace = true
